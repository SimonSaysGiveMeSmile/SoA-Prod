name: Release (macOS)

on:
  push:
    tags:
      - "v*-mac"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v2.2.17-mac). Must already exist on main."
        required: true
        type: string

concurrency:
  group: release-mac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-notarize:
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${{ inputs.tag || github.ref_name }}"
          EXPECTED_TAG="v${VERSION}-mac"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::tag '$TAG' does not match package.json version (expected '$EXPECTED_TAG')"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install root deps
        run: npm install --legacy-peer-deps

      - name: Install desktop deps
        working-directory: desktop
        run: npm install --legacy-peer-deps

      - name: Setup signing keychain
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_KEYCHAIN_PWD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PWD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
          rm -f "$CERT_PATH"

      - name: Prebuild (mobile + npm install in prebuild-src)
        working-directory: desktop
        run: npm run prebuild-darwin

      - name: Build, sign, and notarize
        working-directory: desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build-darwin -- --publish=never

      - name: Verify Developer ID + Notarization
        working-directory: desktop
        run: |
          set -euo pipefail
          for arch_dir in "dist/mac" "dist/mac-arm64"; do
            APP="$arch_dir/Son of Anton.app"
            echo "=== $APP ==="
            spctl -a -vvv -t exec "$APP" 2>&1 | tee /tmp/spctl.txt
            grep -q "source=Notarized Developer ID" /tmp/spctl.txt
            codesign -dvv "$APP" 2>&1 | tee /tmp/cs.txt
            grep -q "Developer ID Application: " /tmp/cs.txt
            grep -q "TeamIdentifier=${{ secrets.APPLE_TEAM_ID }}" /tmp/cs.txt
          done

      - name: Cleanup prebuild-src
        working-directory: desktop
        if: always()
        run: npm run postbuild-darwin || true

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Son of Anton ${{ steps.version.outputs.version }} (macOS)" \
              --notes "Built by CI from ${{ github.sha }}. Signed with Developer ID Application: Jiahe Tian (${{ secrets.APPLE_TEAM_ID }}) and notarized by Apple. See commit history for changes." \
              --draft
          fi
          gh release upload "$TAG" --clobber \
            "desktop/dist/Son-of-Anton-macOS-arm64.dmg" \
            "desktop/dist/Son-of-Anton-macOS-arm64.dmg.blockmap" \
            "desktop/dist/Son-of-Anton-macOS-x64.dmg" \
            "desktop/dist/Son-of-Anton-macOS-x64.dmg.blockmap" \
            "desktop/dist/latest-mac.yml"
          gh release edit "$TAG" --draft=false

      - name: Teardown keychain
        if: always()
        env:
          MACOS_KEYCHAIN_PWD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
